[project]
name = "kalshi-degen-mcp"
version = "0.1.2"
description = "Open-source MCP server for Kalshi Trade API v2 market research and trading"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nigel Norris" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = ["httpx>=0.27", "cryptography>=42", "mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/imrasalghul/KalshiMCP"
Issues = "https://github.com/imrasalghul/KalshiMCP/issues"

[project.scripts]
kalshi-degen-mcp = "kalshi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["kalshi_mcp"]
include = ["kalshi_mcp/openapi.yaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
